<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found — Deen Yeasin Radid</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090b12;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .card {
      max-width: 460px;
      width: 100%;
      padding: 36px;
      border-radius: 20px;
      background: #111524;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .code {
      font-size: 48px;
      font-weight: 800;
      color: #818cf8;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      background: #6366f1;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has moved. Return to the official profile of Deen Yeasin Radid.</p>
    <a href="/">Go to Official Profile</a>

</body>
</html>
